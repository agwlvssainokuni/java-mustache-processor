name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches artifact version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -m1 '^\s*version = ' build.gradle.kts | sed -E 's/.*version = "(.*)".*/\1/')
          echo "Tag: $GITHUB_REF_NAME (compared as: $TAG)"
          echo "Artifact version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Pushed tag ($GITHUB_REF_NAME) does not match artifact version ($VERSION). Aborting release."
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cherry-mustache-core/build/libs/*.jar
            cherry-mustache-cli/build/libs/*.jar
          generate_release_notes: true
